<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>💡 조도 통합 시스템</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column}
.bar{display:flex;background:linear-gradient(135deg,#1e293b,#0f172a);border-bottom:2px solid rgba(251,191,36,.25);padding:5px;gap:4px;flex-shrink:0;overflow-x:auto}
.bar::-webkit-scrollbar{display:none}
.b{flex:1 1 0;min-width:64px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:9px;color:#94a3b8;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px}
.b:active{transform:scale(.97)}
.b.on{background:linear-gradient(135deg,#422006,#a16207);border-color:#fbbf24;color:#fde68a;box-shadow:0 2px 10px rgba(251,191,36,.25)}
.b .ic{font-size:15px}
.u{display:none;flex-shrink:0;padding:4px 10px;background:rgba(74,222,128,.08);border-bottom:1px solid rgba(74,222,128,.15);font-size:11px;color:#86efac;text-align:center}
.u.on{display:block}
.u b{color:#bbf7d0;font-weight:700}
.u .lo{margin-left:8px;color:#fca5a5;cursor:pointer;font-weight:700;background:none;border:none;font-size:11px;font-family:inherit}
.f{flex:1;position:relative;background:#0f172a;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block}
iframe.h{display:none}
.l{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#94a3b8;font-size:13px;gap:10px;z-index:10}
.l.h{display:none}
.l .s{width:32px;height:32px;border:3px solid rgba(251,191,36,.2);border-top-color:#fbbf24;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ft{flex-shrink:0;padding:3px 10px;text-align:center;font-size:9px;color:#64748b;background:#1e293b;border-top:1px solid rgba(255,255,255,.04);letter-spacing:.3px}
</style>
</head>
<body>

<div class="bar">
  <button class="b on" id="bPlan" onclick="sw('plan')"><span class="ic">📅</span><span>계획</span></button>
  <button class="b" id="bCheck" onclick="sw('check')"><span class="ic">📋</span><span>측정</span></button>
  <button class="b" id="bReport" onclick="sw('report')"><span class="ic">📑</span><span>결재</span></button>
  <button class="b" id="bHist" onclick="sw('hist')"><span class="ic">📊</span><span>이력</span></button>
  <button class="b" id="bSet" onclick="sw('set')"><span class="ic">⚙</span><span>설정</span></button>
  <button class="b" id="bStd" onclick="sw('std')"><span class="ic">📐</span><span>기준</span></button>
</div>

<div class="u" id="us">👤 <b id="un">-</b><button class="lo" onclick="logout()">로그아웃</button></div>

<script>
/* DecompressionStream으로 gzip 풀기 (Chrome 80+, Safari 16+, Firefox 113+) */
async function unzipB64(b64){
  // base64 → Uint8Array
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  // gzip 해제
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder('utf-8').decode(buf);
}

const F = {
  std:    { el:'fStd',    btn:'bStd',    gz:GZ_STDPLAN, html:null, loaded:false, hash:'#std'   },
  plan:   { el:'fPlan',   btn:'bPlan',   gz:GZ_STDPLAN, html:null, loaded:false, hash:'#plan'  },
  check:  { el:'fCheck',  btn:'bCheck',  gz:GZ_CHECK,   html:null, loaded:false, hash:null     },
  report: { el:'fReport', btn:'bReport', gz:GZ_REPORT,  html:null, loaded:false, hash:null     },
  hist:   { el:'fHist',   btn:'bHist',   gz:GZ_HIST,    html:null, loaded:false, hash:null     },
  set:    { el:'fSet',    btn:'bSet',    gz:GZ_SET,     html:null, loaded:false, hash:null     }
};
let current = 'plan';

const ld = document.getElementById('ld');
function showL(){ ld.classList.remove('h'); }
function hideL(){ ld.classList.add('h'); }

// std/plan은 같은 GZ 데이터를 공유 - 한 번만 풀기
const decompressCache = new Map();   // gz_b64 → resolved html string
async function getHtml(key){
  const f = F[key];
  if(f.html) return f.html;
  // 이미 디코딩 진행 중이거나 완료된 Promise를 재사용
  let p = decompressCache.get(f.gz);
  if(!p){
    p = unzipB64(f.gz);
    decompressCache.set(f.gz, p);
  }
  const html = await p;
  // resolved 값을 캐시에 다시 저장 (다음 호출은 즉시 반환)
  decompressCache.set(f.gz, Promise.resolve(html));
  f.html = html;
  return html;
}

async function loadFrame(key){
  const f = F[key];
  const el = document.getElementById(f.el);
  if(f.loaded) return;
  if(el.srcdoc) return;  // 이미 로딩 시작됨
  const html = await getHtml(key);
  el.addEventListener('load', ()=>{
    f.loaded = true;
    if(current === key) hideL();
    updU();
    if(f.hash){
      try{ el.contentWindow.location.hash = f.hash; }catch(e){}
    }
  }, {once:true});
  el.srcdoc = html;
}

function sw(mode){
  if(!F[mode]) return;
  current = mode;
  Object.keys(F).forEach(k=>{
    const f = F[k];
    const btn = document.getElementById(f.btn);
    const el = document.getElementById(f.el);
    if(k === mode){
      btn.classList.add('on');
      el.classList.remove('h');
      if(!f.loaded){ showL(); loadFrame(k); }
      else hideL();
    }else{
      btn.classList.remove('on');
      el.classList.add('h');
    }
  });
  updU();
}

/* 기본 plan 즉시 로드, 나머지 백그라운드 프리로드 */
loadFrame('plan');
setTimeout(()=>loadFrame('check'),  400);
setTimeout(()=>loadFrame('report'), 900);
setTimeout(()=>loadFrame('hist'),   1500);
setTimeout(()=>loadFrame('set'),    2100);
setTimeout(()=>loadFrame('std'),    2700);

function updU(){
  try{
    const a = JSON.parse(localStorage.getItem('ILLUM_PIN_AUTH')||'null');
    const us = document.getElementById('us');
    if(a && a.name){
      us.classList.add('on');
      document.getElementById('un').textContent = a.dept ? `${a.name} / ${a.dept}` : a.name;
    }else us.classList.remove('on');
  }catch(e){}
}
function logout(){
  if(!confirm('로그아웃하시겠습니까?')) return;
  try{
    localStorage.removeItem('ILLUM_PIN_AUTH');
    localStorage.removeItem('ILLUM_LAST_INSPECTOR');
    const k='P_MONTHLY_V3_SETTINGS';
    const c=JSON.parse(localStorage.getItem(k)||'{}');
    c.my_pin=''; c.my_name='';
    localStorage.setItem(k, JSON.stringify(c));
  }catch(e){}
  location.reload();
}
updU();
setInterval(updU, 2000);
</script>

  function showPopup(rows){
    if(!rows.length) return;
    ensureStyle();
    var old=document.querySelector('.apv-overlay'); if(old) old.remove();
    var items = rows.map(function(r){
      var step = STEP_NAMES[r.current_step]||'';
      var period = (r.target_year||'')+'년 '+(r.target_month||'')+'월';
      return '<li><span class="t">'+esc(r.template_name||r.template_code)+'</span>'
        +'<span class="m">'+esc(period)+' · 요청자 '+esc(r.step1_name||'-')
        +' · 현재 '+esc(step)+' 단계</span></li>';
    }).join('');
    var ov=document.createElement('div'); ov.className='apv-overlay';
    ov.innerHTML='<div class="apv-card" role="alertdialog" aria-label="결재 대기 알림">'
      +'<span class="apv-bell">🔔</span>'
      +'<div class="apv-head"><span class="dot"></span>결재 대기 알림</div>'
      +'<div class="apv-count">결재하실 보고서 <b>'+rows.length+'</b>건이 있습니다.</div>'
      +'<ul class="apv-list">'+items+'</ul>'
      +'<div class="apv-btns">'
      +'<button class="apv-btn go">결재하러 가기</button>'
      +'<button class="apv-btn close">나중에</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('.close').onclick=function(){ ov.remove(); };
    ov.querySelector('.go').onclick=function(){ ov.remove(); gotoInbox(); };
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
  }

  function check(){
    if(shownThisSession) return;
    var pin = getMyPin();
    if(!pin) return;   // 아직 PIN 미설정 → 다음 폴링에서 재시도
    var url = SB_URL + '/rest/v1/p_monthly_report'
      + '?select=id,template_code,template_name,target_year,target_month,current_step,step1_name'
      + '&next_approver_pin=eq.' + encodeURIComponent(pin)
      + '&status=neq.COMPLETED&status=neq.REJECTED'
      + '&order=updated_at.desc';
    fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
      .then(function(res){ return res.ok ? res.json() : []; })
      .then(function(rows){
        if(rows && rows.length){ shownThisSession=true; showPopup(rows); }
      })
      .catch(function(e){ console.warn('[결재알림] 조회 실패', e); });
  }

  function start(){
    check();
    // PIN이 늦게 설정되는 경우 대비: 팝업 뜰 때까지 잠깐 폴링
    var tries=0;
    var t=setInterval(function(){
      tries++;
      if(shownThisSession || tries>10){ clearInterval(t); return; }
      check();
    }, 2000);
  }
  if(document.readyState==='loading') window.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

</body>
</html>
