<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>측정기 종합현황 v1.8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap">
<style>
  :root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--ng:#ef4444;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px}
  .hdr{background:linear-gradient(135deg,#0c4a6e,#0369a1);padding:16px;text-align:center;position:relative}
  .hdr h1{font-size:18px;font-weight:900;letter-spacing:-.3px}
  .hdr p{font-size:11px;color:#7dd3fc;margin-top:3px}
  .toolbar{max-width:1200px;margin:12px auto;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text2)}
  .legend-item{display:flex;align-items:center;gap:4px}
  .legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
  .btn-refresh{padding:8px 14px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-family:inherit}
  .btn-refresh:hover{background:var(--accent);color:#0f172a}
  .stats{display:flex;gap:8px;font-size:11px;color:var(--text2)}
  .stats b{color:var(--text)}
  .grid{max-width:1200px;margin:0 auto;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card:active{transform:scale(.98)}
  .card-head{padding:12px 14px;background:linear-gradient(135deg,rgba(56,189,248,.1),rgba(56,189,248,.04));border-bottom:1.5px solid var(--border);font-size:14px;font-weight:700;color:var(--text);text-align:center;line-height:1.3;min-height:56px;display:flex;align-items:center;justify-content:center}
  .card-body{display:grid;grid-template-rows:repeat(3,1fr)}
  .cell{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;transition:all .15s}
  .cell:last-child{border-bottom:none}
  .cell-label{display:flex;align-items:center;gap:6px}
  .cell-status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
  .cell.ok{background:rgba(100,116,139,.05);color:var(--text2)}
  .cell.ok .cell-status{background:rgba(34,197,94,.15);color:var(--ok)}
  .cell.due{background:rgba(245,158,11,.12);color:var(--warn);font-weight:700}
  .cell.due .cell-status{background:var(--warn);color:#0f172a}
  .cell.overdue{background:rgba(239,68,68,.15);color:#fca5a5;font-weight:700;animation:pulse 2s ease-in-out infinite}
  .cell.overdue .cell-status{background:var(--ng);color:#fff}
  .cell.never{background:rgba(239,68,68,.18);color:#fca5a5;font-weight:700}
  .cell.never .cell-status{background:#7f1d1d;color:#fff}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
  .empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
  .loading{text-align:center;padding:40px;color:var(--text2);font-size:12px}

  /* 일괄 점검완료 영역 */
  .bulk-section{max-width:1200px;margin:20px auto 0;padding:16px 12px;border-top:2px solid var(--border)}
  .bulk-title{font-size:14px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px}
  .bulk-desc{font-size:11px;color:var(--text3);text-align:center;margin-bottom:14px}
  .bulk-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:600px;margin:0 auto}
  .bulk-btn{padding:14px 10px;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;border:none;color:#fff;transition:transform .1s,opacity .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
  .bulk-btn:hover{transform:translateY(-2px);opacity:.92}
  .bulk-btn:active{transform:scale(.97)}
  .bulk-btn:disabled{opacity:.5;cursor:wait;transform:none}
  .bulk-btn .b-sub{font-size:10px;font-weight:500;opacity:.9}
  .bulk-btn.daily{background:linear-gradient(135deg,#0ea5e9,#0369a1)}
  .bulk-btn.weekly{background:linear-gradient(135deg,#f59e0b,#d97706)}
  .bulk-btn.monthly{background:linear-gradient(135deg,#a855f7,#7c3aed)}

  /* 토스트 */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1.5px solid var(--accent);color:var(--text);padding:14px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90%;text-align:center}
  .toast.success{border-color:var(--ok)}
  .toast.error{border-color:var(--ng)}

  /* 확인 모달 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:22px;max-width:380px;width:100%}
  .modal h3{font-size:16px;font-weight:700;margin-bottom:10px;color:var(--text)}
  .modal p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px}
  .modal p b{color:var(--accent)}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  .mbtn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
  .mbtn.cancel{background:var(--surface2);color:var(--text)}
  .mbtn.confirm{background:var(--ok);color:#0f172a}

  @media(max-width:600px){
    .grid{grid-template-columns:1fr 1fr;gap:8px;padding:8px}
    .card-head{font-size:12px;padding:10px;min-height:48px}
    .cell{padding:8px 10px;font-size:11px}
    .toolbar{flex-direction:column;align-items:flex-start}
    .bulk-btn{padding:12px 6px;font-size:12px}
  }
  @media(max-width:380px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="hdr">
  <h1>📐 측정기 종합현황</h1>
  <p>일간 · 주간 · 월간 점검 주기 모니터링</p>
</div>

<div class="toolbar">
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:rgba(34,197,94,.4)"></span>정상</span>
    <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>오늘 도래</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span>지연</span>
    <span class="legend-item"><span class="legend-dot" style="background:#7f1d1d"></span>미점검</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="stats" id="statsLine">로딩...</span>
    <button class="btn-refresh" onclick="loadStatus()">🔄 새로고침</button>
  </div>
</div>

<div class="grid" id="grid"><div class="loading">⏳ 측정기 점검 현황 조회 중...</div></div>

<!-- 일괄 점검완료 영역 -->
<div class="bulk-section">
  <div class="bulk-title">⚡ 일괄 점검완료 (모든 측정기 OK 판정)</div>
  <div class="bulk-desc">버튼 클릭 시 해당 주기의 전체 측정기 항목이 OK로 일괄 저장됩니다</div>
  <div class="bulk-btns">
    <button class="bulk-btn daily"   id="btnDaily"   onclick="askBulk(1)">
      ✅ 일간 점검완료
      <span class="b-sub">매일 점검 항목</span>
    </button>
    <button class="bulk-btn weekly"  id="btnWeekly"  onclick="askBulk(7)">
      ✅ 주간 점검완료
      <span class="b-sub">7일 주기 항목</span>
    </button>
    <button class="bulk-btn monthly" id="btnMonthly" onclick="askBulk(30)">
      ✅ 월간 점검완료
      <span class="b-sub">30일 주기 항목</span>
    </button>
  </div>
</div>

<!-- 확인 모달 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle">일괄 점검완료 확인</h3>
    <p id="modalBody"></p>
    <div class="modal-btns">
      <button class="mbtn cancel"  onclick="closeModal()">취소</button>
      <button class="mbtn confirm" id="modalOk">실행</button>
    </div>
  </div>
</div>

};

function daysBetween(d1, d2){
  const ms = new Date(d2) - new Date(d1);
  return Math.floor(ms / (1000*60*60*24));
}

function todayKST(){
  // 로컬(KST) 기준 YYYY-MM-DD
  // toISOString()은 UTC라 KST 새벽엔 전날로 밀릴 위험 → 로컬 시간 직접 조립
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}

function nowKSTISO(){
  // KST 기준 ISO (offset +09:00 포함)
  const now = new Date();
  const off = 9 * 60;
  const local = new Date(now.getTime() + (off - now.getTimezoneOffset()) * 60000);
  const y = local.getFullYear();
  const m = String(local.getMonth()+1).padStart(2,'0');
  const d = String(local.getDate()).padStart(2,'0');
  const hh = String(local.getHours()).padStart(2,'0');
  const mm = String(local.getMinutes()).padStart(2,'0');
  const ss = String(local.getSeconds()).padStart(2,'0');
  return `${y}-${m}-${d}T${hh}:${mm}:${ss}+09:00`;
}

// YYYY-MM-DD 입력 → 그 날이 속한 주의 월요일 YYYY-MM-DD 반환
function mondayOf(ymd){
  const parts = String(ymd).split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  const day = dt.getDay();
  const offset = (day === 0) ? -6 : (1 - day);
  dt.setDate(dt.getDate() + offset);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return yy+'-'+mm+'-'+dd;
}
function sameWeek(d1, d2){ return mondayOf(d1) === mondayOf(d2); }
function sameMonth(d1, d2){ return String(d1).slice(0,7) === String(d2).slice(0,7); }
function weeksBetween(d1, d2){ return Math.floor(daysBetween(mondayOf(d1), mondayOf(d2)) / 7); }
function monthsBetween(d1, d2){
  const a = String(d1).split('-').map(Number), b = String(d2).split('-').map(Number);
  return (b[0]-a[0])*12 + (b[1]-a[1]);
}

function cellStatus(period, lastDate, today){
  // 도래 판정 (캘린더 기준)
  // 일간: 날짜 다르면 due, 2일 이상이면 overdue
  // 주간: 같은 주 안이면 ok, 1주 차이면 due, 2주 이상이면 overdue
  // 월간: 같은 달 안이면 ok, 1달 차이면 due, 2달 이상이면 overdue
  if(!lastDate) return 'never';
  if(lastDate === today) return 'ok';
  const diff = daysBetween(lastDate, today);
  if(period === 1){
    if(diff >= 2) return 'overdue';
    return 'due';
  }
  if(period === 7){
    if(sameWeek(lastDate, today)) return 'ok';
    if(weeksBetween(lastDate, today) >= 2) return 'overdue';
    return 'due';
  }
  if(period === 30){
    if(sameMonth(lastDate, today)) return 'ok';
    if(monthsBetween(lastDate, today) >= 2) return 'overdue';
    return 'due';
  }
  return 'ok';
}

async function getEqItems(eqName){
  try{
    const url = SB_URL + '/rest/v1/common_code?select=code_value,sort_order&code_group=eq.' +
                eqGroupKey(eqName) + '&order=sort_order.asc&limit=200';
    const r = await fetch(url, {headers:SB_HEADERS});
    if(r.ok){
      const data = await r.json();
      if(data && data.length){
        const parsed = [];
        data.forEach(rec=>{
          try{
            const o = JSON.parse(rec.code_value||'{}');
            if(o && o.label) parsed.push({label:o.label, period:Number(o.period)||1});
          }catch(e){}
        });
        if(parsed.length) return parsed;
      }
    }
  }catch(e){ console.warn('항목 서버 조회 실패:', eqName); }
  return DEFAULT_CHECKLIST_DB[eqName] || [];
}

async function fetchEqStatus(eqName){
  try{
    const items = await getEqItems(eqName);
    const periodMap = {};
    items.forEach(it=>{ periodMap[it.label] = it.period; });

    const url = SB_URL + '/rest/v1/qc_measure_log?select=check_date,items_json&equipment=eq.' +
                encodeURIComponent(eqName) + '&order=check_date.desc&limit=60';
    const r = await fetch(url, {headers:SB_HEADERS});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();

    let dailyLast = null, weeklyLast = null, monthlyLast = null;
    for(const row of rows){
      const itemsJson = row.items_json || {};
      let hasDaily=false, hasWeekly=false, hasMonthly=false;
      for(const label of Object.keys(itemsJson)){
        const p = periodMap[label];
        if(p === 1) hasDaily = true;
        else if(p === 7) hasWeekly = true;
        else if(p === 30) hasMonthly = true;
      }
      if(hasDaily && !dailyLast) dailyLast = row.check_date;
      if(hasWeekly && !weeklyLast) weeklyLast = row.check_date;
      if(hasMonthly && !monthlyLast) monthlyLast = row.check_date;
      if(dailyLast && weeklyLast && monthlyLast) break;
    }
    return {daily:dailyLast, weekly:weeklyLast, monthly:monthlyLast, items:items, hasItems: items.length>0};
  }catch(e){
    console.warn('상태 조회 실패:', eqName, e);
    return {daily:null, weekly:null, monthly:null, items:[], error: e.message};
  }
}

function renderCard(eq, status){
  const today = todayKST();
  const dailyStat = cellStatus(1, status.daily, today);
  const weeklyStat = cellStatus(7, status.weekly, today);
  const monthlyStat = cellStatus(30, status.monthly, today);

  const cells = [
    {label:'일간', period:1, stat:dailyStat, lastDate:status.daily},
    {label:'주간', period:7, stat:weeklyStat, lastDate:status.weekly},
    {label:'월간', period:30, stat:monthlyStat, lastDate:status.monthly},
  ];

  function cellHtml(c){
    const dot = (c.stat==='overdue'||c.stat==='never') ? '🔴' :
                (c.stat==='due') ? '🟡' : '✓';
    let statusLabel;
    if(c.stat==='never') statusLabel = '미점검';
    else if(c.stat==='overdue'){
      const d = c.lastDate ? daysBetween(c.lastDate, today) : 0;
      statusLabel = 'D+'+d;
    }
    else if(c.stat==='due') statusLabel = '오늘';
    else if(c.lastDate === today) statusLabel = '오늘 완료';
    else {
      const d = daysBetween(c.lastDate, today);
      statusLabel = d===0 ? '오늘' : (d+'일전');
    }
    return '<div class="cell '+c.stat+'">' +
      '<span class="cell-label">'+dot+' '+c.label+'</span>' +
      '<span class="cell-status">'+statusLabel+'</span></div>';
  }

  return '<div class="card" onclick="goPage(\''+eq.key+'\')">' +
    '<div class="card-head">'+eq.name+'</div>' +
    '<div class="card-body">' +
      cells.map(cellHtml).join('') +
    '</div></div>';
}

async function askBulk(period){
  // 해당 주기에 항목이 있는 측정기 개수 카운트
  let eqCount = 0, itemCount = 0;
  EQUIPMENTS.forEach((eq, i)=>{
    const items = (__allStatusCache[i] && __allStatusCache[i].items) ? __allStatusCache[i].items : (DEFAULT_CHECKLIST_DB[eq.name]||[]);
    const matched = items.filter(it => Number(it.period)===period);
    if(matched.length>0){ eqCount++; itemCount += matched.length; }
  });

  if(eqCount===0){
    showToast(periodLabel(period)+' 주기 항목이 없습니다', 'error');
    return;
  }

  // 일간일 때만 백필(빠진 평일) 자동 채움 안내
  let backfillDays = [];
  let backfillNote = '';
  if(period === 1){
    const recent = await getRecentBulkDate();
    const today = todayKST();
    if(recent && recent < today){
      backfillDays = missingWeekdays(recent, today);
    }
    if(backfillDays.length > 0){
      const dl = backfillDays.map(d => {
        const dd = new Date(d.split('-')[0], parseInt(d.split('-')[1])-1, d.split('-')[2]);
        const w = ['일','월','화','수','목','금','토'][dd.getDay()];
        return d+'('+w+')';
      }).join(', ');
      backfillNote =
        '<div style="margin-top:10px;padding:10px;background:rgba(245,158,11,.12);border-left:3px solid #f59e0b;border-radius:4px;font-size:12px;line-height:1.6">' +
        '⚠ 빠진 평일 <b>'+backfillDays.length+'일</b> 자동 채움<br>' +
        '<span style="color:var(--text2);font-size:11px">'+dl+'</span><br>' +
        '<span style="color:var(--text3);font-size:10px">· 각 평일에 일간 항목 OK · 각 주 마지막 평일에 주간 / 각 달 마지막 평일에 월간 항목도 함께 OK<br>· 시간 랜덤 (08:30~12:00 또는 13:30~16:30) · 점검자: '+getCurrentInspector()+'</span>' +
        '</div>';
    }
  }

  const body =
    '<b>'+periodLabel(period)+'</b> 점검을 일괄 완료 처리합니다.<br><br>' +
    '· 대상 측정기: <b>'+eqCount+'대</b><br>' +
    '· 대상 항목: <b>'+itemCount+'개</b> (모두 OK 판정)<br>' +
    '· 점검일: <b>'+todayKST()+'</b>' +
    backfillNote +
    '<br><br>실행하시겠습니까?';

  openModal('일괄 점검완료 확인', body, ()=>runBulk(period, backfillDays));
}

// 평일 여부 (월=1 ~ 금=5)
function isWeekday(ymd){
  const p = String(ymd).split('-').map(Number);
  const day = new Date(p[0], p[1]-1, p[2]).getDay();
  return day >= 1 && day <= 5;
}

// fromYmd 다음날부터 toYmd 전날까지의 평일 목록
function missingWeekdays(fromYmd, toYmd){
  const result = [];
  if(!fromYmd || !toYmd) return result;
  const p1 = String(fromYmd).split('-').map(Number);
  const p2 = String(toYmd).split('-').map(Number);
  const cur = new Date(p1[0], p1[1]-1, p1[2]);
  cur.setDate(cur.getDate() + 1);                  // 시작일 다음날부터
  const end = new Date(p2[0], p2[1]-1, p2[2]);     // 종료일 미포함
  let safety = 0;
  while(cur < end && safety++ < 400){              // 안전 가드 400일
    const day = cur.getDay();
    if(day >= 1 && day <= 5){
      const y = cur.getFullYear();
      const m = String(cur.getMonth()+1).padStart(2,'0');
      const d = String(cur.getDate()).padStart(2,'0');
      result.push(y+'-'+m+'-'+d);
    }
    cur.setDate(cur.getDate() + 1);
  }
  return result;
}

// 근무시간 내 랜덤 시각 (08:30~12:00 또는 13:30~16:30)
function randomWorkTime(){

  let totalMin;
  if(isAm){

  const m = String(totalMin%60).padStart(2,'0');
  const s = String(Math.floor(Math.random()*60)).padStart(2,'0');
  return h+':'+m+':'+s;
}

// 백필 INSERT/PATCH (특정 날짜에 일간 + 옵션으로 주간/월간 항목 추가)
// 같은 (eq, date) row가 이미 있으면 items_json merge로 PATCH, 없으면 POST
async function backfillEqLog(eqName, date, time, items, inspector, includeWeekly, includeMonthly){
  const itemsJson = {};
  items.forEach(it => {
    const p = Number(it.period);
    if(p === 1) itemsJson[it.label] = 'OK';
    else if(p === 7 && includeWeekly) itemsJson[it.label] = 'OK';
    else if(p === 30 && includeMonthly) itemsJson[it.label] = 'OK';
  });
  if(Object.keys(itemsJson).length === 0) return;

  // 기존 row 확인
  const qUrl = SB_URL + '/rest/v1/qc_measure_log?select=id,items_json&equipment=eq.' +
               encodeURIComponent(eqName) + '&check_date=eq.' + date + '&limit=1';
  const qr = await fetch(qUrl, {headers: SB_HEADERS});
  if(!qr.ok) throw new Error('백필 조회실패 HTTP '+qr.status);
  const exist = await qr.json();

  if(exist && exist.length > 0){
    // 기존 row와 merge → PATCH
    const cur = exist[0].items_json || {};
    const merged = Object.assign({}, cur, itemsJson);
    const ng = Object.values(merged).filter(v => v === 'NG').length;
    const pr = await fetch(SB_URL + '/rest/v1/qc_measure_log?id=eq.' + exist[0].id, {
      method: 'PATCH',
      headers: SB_HEADERS_POST,
      body: JSON.stringify({ items_json: merged, ng_count: ng, result: ng > 0 ? 'NG' : 'OK' })
    });
    if(!pr.ok){ const t = await pr.text(); throw new Error('백필 PATCH 실패 '+pr.status+' '+t); }
  } else {
    // 신규 row → POST
    const payload = {
      check_date: date,
      check_time: time,
      inspector: inspector,
      equipment: eqName,
      items_json: itemsJson,
      ng_count: 0,
      result: 'OK',
      memo: '(자동 채움)'
    };
    const pr = await fetch(SB_URL + '/rest/v1/qc_measure_log', {
      method: 'POST',
      headers: SB_HEADERS_POST,
      body: JSON.stringify(payload)
    });
    if(!pr.ok){ const t = await pr.text(); throw new Error('백필 POST 실패 '+pr.status+' '+t); }
  }
}

async function upsertEqLog(eqName, period, items){
  // 해당 주기 항목만 OK로 저장. 같은 날짜+장비 기존 row가 있으면 items_json을 merge하여 PATCH, 없으면 POST.
  const today = todayKST();
  const targetItems = items.filter(it => Number(it.period)===period);
  if(targetItems.length===0) return {skipped:true};

  // 1) 기존 row 조회
  const qUrl = SB_URL + '/rest/v1/qc_measure_log?select=id,items_json&equipment=eq.' +
               encodeURIComponent(eqName) + '&check_date=eq.' + today + '&limit=1';
  const qr = await fetch(qUrl, {headers:SB_HEADERS});
  if(!qr.ok) throw new Error('조회실패 HTTP '+qr.status);
  const exist = await qr.json();

  // items_json은 개별 페이지와 동일하게 { 라벨: 'OK' } 단순 문자열 형식으로 통일
  // (객체로 저장하면 개별 페이지의 calcDueMap이 도래 인식 못함)
  const okItems = {};
  targetItems.forEach(it=>{ okItems[it.label] = 'OK'; });

  // 점검자: ESG 로그인 우선, 없으면 '일괄완료'
  const auth = getEsgAuth();
  const inspector = auth ? auth.name : '일괄완료';

  if(exist && exist.length>0){
    // 기존 row와 merge → PATCH (items_json만 갱신)
    const cur = exist[0].items_json || {};
    const merged = Object.assign({}, cur, okItems);
    // NG 개수 재계산 (값이 'NG' 문자열인 것만 카운트)
    const ng = Object.values(merged).filter(v => v==='NG').length;
    const patchUrl = SB_URL + '/rest/v1/qc_measure_log?id=eq.' + exist[0].id;
    const pr = await fetch(patchUrl, {
      method:'PATCH',
      headers: SB_HEADERS_POST,
      body: JSON.stringify({
        items_json: merged,
        ng_count: ng,
        result: ng>0?'NG':'OK'
      })
    });
    if(!pr.ok){
      const txt = await pr.text();
      throw new Error('PATCH 실패 HTTP '+pr.status+' '+txt);
    }
    return {updated:true, items:Object.keys(okItems).length};
  } else {
    // 신규 row — 실제 테이블 컬럼명에 맞춘 페이로드
    const postUrl = SB_URL + '/rest/v1/qc_measure_log';
    const payload = {
      check_date: today,
      check_time: nowKSTTime(),
      inspector: inspector,
      equipment: eqName,
      items_json: okItems,
      ng_count: 0,
      result: 'OK',
      memo: '대시보드 일괄 OK'
    };
    const pr = await fetch(postUrl, {
      method:'POST',
      headers: SB_HEADERS_POST,
      body: JSON.stringify(payload)
    });
    if(!pr.ok){
      const txt = await pr.text();
      throw new Error('POST 실패 HTTP '+pr.status+' '+txt);
    }
    return {inserted:true, items:Object.keys(okItems).length};
  }
}

async function runBulk(period, backfillDays){
  backfillDays = backfillDays || [];
  const btnMap = {1:'btnDaily', 7:'btnWeekly', 30:'btnMonthly'};
  const btn = document.getElementById(btnMap[period]);
  if(btn){ btn.disabled = true; btn.textContent = '⏳ 저장 중...'; }

  let okEq = 0, skipEq = 0, totalItems = 0;
  let backfillOk = 0, backfillFail = 0;
  const errors = [];

  // 1) 백필 먼저 (일간 버튼에서만 트리거)
  //    날짜별 동일 시간(이날 모든 측정기 공통), 날짜끼리는 다른 시간
  //    각 주의 마지막 백필 평일에 주간 항목도 함께, 각 달의 마지막 평일에 월간 항목도 함께 merge
  let weeklyBackfillCount = 0, monthlyBackfillCount = 0;
  if(period === 1 && backfillDays.length > 0){
    const inspector = getCurrentInspector();

    // 각 주(monday) / 각 달(YYYY-MM)의 마지막 백필 평일 찾기
    const weekLastDay = {};   // mondayOf(date) → 그 주에서 가장 늦은 백필 평일
    const monthLastDay = {};  // YYYY-MM → 그 달에서 가장 늦은 백필 평일
    backfillDays.forEach(d => {
      const wk = mondayOf(d);
      const mn = d.slice(0,7);
      if(!weekLastDay[wk] || weekLastDay[wk] < d) weekLastDay[wk] = d;
      if(!monthLastDay[mn] || monthLastDay[mn] < d) monthLastDay[mn] = d;
    });

    for(const date of backfillDays){
      const time = randomWorkTime();
      const wk = mondayOf(date);
      const mn = date.slice(0,7);
      const includeWeekly  = (weekLastDay[wk] === date);
      const includeMonthly = (monthLastDay[mn] === date);

      for(let i=0; i<EQUIPMENTS.length; i++){
        const eq = EQUIPMENTS[i];
        const cached = __allStatusCache[i];
        let items = (cached && cached.items && cached.items.length) ? cached.items : (DEFAULT_CHECKLIST_DB[eq.name]||[]);
        if(!items || items.length===0){
          try{ items = await getEqItems(eq.name); }catch(e){ items = []; }
        }
        if(!items || items.length === 0) continue;
        try{
          await backfillEqLog(eq.name, date, time, items, inspector, includeWeekly, includeMonthly);
          backfillOk++;
        }catch(e){
          backfillFail++;
          console.error('백필 실패', eq.name, date, e);
        }
      }
      if(includeWeekly) weeklyBackfillCount++;
      if(includeMonthly) monthlyBackfillCount++;
    }
  }

  // 2) 오늘 일괄저장 (기존 로직)
  for(let i=0; i<EQUIPMENTS.length; i++){
    const eq = EQUIPMENTS[i];
    const cached = __allStatusCache[i];
    let items = (cached && cached.items && cached.items.length) ? cached.items : (DEFAULT_CHECKLIST_DB[eq.name]||[]);
    if(!items || items.length===0){
      try{ items = await getEqItems(eq.name); }catch(e){ items = []; }
    }
    if(!items || items.length===0){ skipEq++; continue; }

    try{
      const r = await upsertEqLog(eq.name, period, items);
      if(r.skipped) skipEq++;
      else { okEq++; totalItems += (r.items||0); }
    }catch(e){
      console.error(eq.name, e);
      errors.push(eq.name+': '+e.message);
    }
  }

  if(btn){
    btn.disabled = false;
    if(period===1)  btn.innerHTML = '✅ 일간 점검완료<span class="b-sub">매일 점검 항목</span>';
    if(period===7)  btn.innerHTML = '✅ 주간 점검완료<span class="b-sub">7일 주기 항목</span>';
    if(period===30) btn.innerHTML = '✅ 월간 점검완료<span class="b-sub">30일 주기 항목</span>';
  }

  let msg = '✅ '+periodLabel(period)+' 일괄 OK: '+okEq+'대 / '+totalItems+'개 항목';
  if(backfillDays.length > 0){
    msg += ' · 백필 '+backfillDays.length+'일 ('+backfillOk+'건';
    if(weeklyBackfillCount > 0) msg += ' · 주간 '+weeklyBackfillCount+'주';
    if(monthlyBackfillCount > 0) msg += ' · 월간 '+monthlyBackfillCount+'달';
    if(backfillFail > 0) msg += ' / 실패 '+backfillFail;
    msg += ')';
  }
  if(errors.length > 0){
    showToast(msg + ' · 일부 실패 '+errors.length+'대 (콘솔 확인)', 'error');
  } else {
    showToast(msg, 'success');
  }

  // 화면 갱신
  await loadStatus();
}

window.addEventListener('DOMContentLoaded', loadStatus);
</script>
